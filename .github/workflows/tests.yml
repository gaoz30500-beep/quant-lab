name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 测试全部离线 (合成数据 + mock), 不触网拉行情
      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v
